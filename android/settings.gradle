pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'BlueWallet'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
include ':detox'
project(':detox').projectDir = new File(rootProject.projectDir, '../node_modules/detox/android/detox')
include ':react-native-camera-kit-no-google'
project(':react-native-camera-kit-no-google').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-camera-kit-no-google/android')
